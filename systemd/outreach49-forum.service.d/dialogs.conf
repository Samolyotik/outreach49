[Service]
# Группа диалогов: туда уезжает вся переписка, в группе заявок остаются только
# карточки менеджеру. Задаётся здесь, а не в /etc/tgradar-outreach/production.env:
# тот файл общий с прежним контуром, и своими правками мы бы его расшатывали.
#
# Настоящий id группы подставляется на боксе — в репозитории id групп не держим.
# Без этой переменной поведение прежнее: всё в одну группу.
Environment=OUTREACH_DIALOG_TELEGRAM_CHAT_ID=-100...
